<title>에이전트 오피스</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;600;700&family=Press+Start+2P&display=swap">
<style>
/* 레이아웃: 위에 현황 한 줄, 왼쪽에 층별 건물 단면(캔버스), 오른쪽에 에이전트 목록과 소식. 폰에서는 한 줄로 쌓는다. 건물 그림은 고정 팔레트, 바깥 UI는 테마 토큰. */
:root {
  --bg: #eef0f6; --surface: #ffffff; --surface-2: #e4e8f2; --line: #ccd3e3; --fg: #16203a; --muted: #55607c;
  --accent: #d9560b; --accent-fg: #ffffff; --done: #12805a; --work: #8a6200; --wait: #6b7690; --fix: #c22c3d; --live: #0f8f84; --focus: #1f66c9;
  --ui: "IBM Plex Sans KR", system-ui, -apple-system, "Segoe UI", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --game: "Do Hyeon", "IBM Plex Sans KR", "Noto Sans KR", "Malgun Gothic", sans-serif;
  --px: "Press Start 2P", ui-monospace, Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1226; --surface: #151c36; --surface-2: #1f2849; --line: #2c3760; --fg: #e8ecf8; --muted: #9aa5c4;
    --accent: #ff8a2b; --accent-fg: #1a1206; --done: #3ecf8e; --work: #f5c451; --wait: #8a95b2; --fix: #ff6b78; --live: #2dd4bf; --focus: #8ec1ff; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1226; --surface: #151c36; --surface-2: #1f2849; --line: #2c3760; --fg: #e8ecf8; --muted: #9aa5c4;
  --accent: #ff8a2b; --accent-fg: #1a1206; --done: #3ecf8e; --work: #f5c451; --wait: #8a95b2; --fix: #ff6b78; --live: #2dd4bf; --focus: #8ec1ff; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font: 15px/1.5 var(--ui); padding-block: 18px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
main { max-width: 1760px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
header { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 8px 16px; }
h1 { margin: 0; font: 400 1.7rem/1.1 var(--game); letter-spacing: .01em; }
h2 { margin: 0 0 8px; font: 400 1.1rem/1.2 var(--game); letter-spacing: .02em; }
.sub { font-size: .85rem; color: var(--muted); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.live { display: inline-flex; align-items: center; gap: 6px; }
.live i { width: 8px; height: 8px; border-radius: 50%; background: var(--wait); display: block; }
.live.on i { background: var(--live); animation: pulse 1.8s infinite; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 var(--live); } 70% { box-shadow: 0 0 0 7px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }
.status { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; background: var(--surface); border: 1px solid var(--line); padding: 10px 14px; }
.status .head { font: 400 1.05rem/1.3 var(--game); flex: 1 1 260px; min-width: 0; }
.status .head small { display: block; font: 400 .82rem/1.4 var(--ui); color: var(--muted); }
.counts { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: .9rem; }
.dot { display: inline-block; width: 10px; height: 10px; margin-right: 6px; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; }
button { font: 600 .85rem/1 var(--ui); color: var(--fg); background: var(--surface-2); border: 1px solid var(--line); padding: 9px 12px; cursor: pointer; }
button:hover { border-color: var(--accent); }
button.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
button:focus-visible, .agent:focus-visible, canvas:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.layout { display: grid; grid-template-columns: minmax(0, 2.5fr) minmax(300px, 1fr); gap: 14px; align-items: start; }
@media (max-width: 1000px) { .layout { grid-template-columns: minmax(0, 1fr); } }
.stage { position: relative; line-height: 0; border: 1px solid var(--line); background: #0b1022; width: 100%; max-width: 1400px; margin-inline: auto; }
.stage.shake { animation: shake .6s linear; }
@keyframes shake { 0%, 100% { transform: translate(0, 0); } 10% { transform: translate(-3px, 1px); } 20% { transform: translate(3px, -1px); } 30% { transform: translate(-3px, -2px); } 40% { transform: translate(2px, 2px); } 50% { transform: translate(-2px, 0); } 60% { transform: translate(3px, 1px); } 70% { transform: translate(-1px, -1px); } 80% { transform: translate(1px, 1px); } }
canvas { display: block; width: 100%; height: auto; image-rendering: auto; touch-action: manipulation; }
.ov { position: absolute; inset: 0; overflow: hidden; pointer-events: none; line-height: 1.25; }
.ov > * { position: absolute; left: 0; top: 0; will-change: transform; }
.ftag { font: 400 calc(11px * var(--k, 1))/1 var(--game); color: #ffb35c; background: #10162f; border: 1px solid #36447a; padding: 3px 6px; letter-spacing: .03em; white-space: nowrap; }
.bub { font: 400 calc(11px * var(--k, 1))/1.2 var(--game); color: #231b2e; background: #fffdf4; border: 2px solid #231b2e; padding: 2px 6px 3px; max-width: calc(160px * var(--k, 1)); white-space: nowrap; overflow: visible; text-overflow: ellipsis; letter-spacing: .01em; z-index: 3; }
.bub::after { content: ""; position: absolute; left: 50%; bottom: -7px; margin-left: -4px; border: 4px solid transparent; border-top: 5px solid #231b2e; }
.bub.good { background: #c9f5dc; } .bub.warn { background: #ff5a5a; color: #fff; } .bub.mail { background: #ffe9a8; } .bub.think { border-radius: 10px; background: #eef3ff; }
.bub.t { text-overflow: ellipsis; overflow: hidden; }
.ntag { font: 400 calc(10px * var(--k, 1))/1 var(--game); color: #fff; background: #10162f; border: 1px solid #36447a; border-left-width: 4px; padding: 2px 5px; white-space: nowrap; z-index: 2; }
.panel { background: var(--surface); border: 1px solid var(--line); padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.side { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.flr { font: 400 .8rem/1 var(--game); letter-spacing: .06em; color: var(--muted); margin: 8px 0 2px; display: flex; align-items: center; gap: 8px; }
.flr::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.agent { display: flex; flex-direction: column; gap: 4px; padding: 7px 9px; border: 1px solid var(--line); background: var(--surface-2); cursor: pointer; text-align: left; font-weight: 400; width: 100%; }
.agent[aria-pressed="true"] { border-color: var(--accent); }
.agent .row { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; }
.agent b { font: 400 1rem/1.2 var(--game); }
.chip { font-size: .72rem; font-weight: 600; padding: 1px 6px; border: 1px solid currentColor; }
.chip.working { color: var(--work); } .chip.done { color: var(--done); } .chip.idle { color: var(--wait); } .chip.fix { color: var(--fix); }
.agent .st { font-size: .8rem; color: var(--muted); min-width: 0; overflow-wrap: anywhere; }
.pieces { display: flex; flex-wrap: wrap; gap: 3px; }
.pc { font-size: .66rem; font-weight: 600; padding: 0 5px; border: 1px solid; }
.pc.done { color: var(--done); } .pc.work { color: var(--work); } .pc.wait { color: var(--wait); } .pc.fix { color: var(--fix); }
.feed { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.feed li { display: grid; grid-template-columns: 3.4em minmax(0, 1fr); gap: 8px; font-size: .86rem; align-items: start; }
.k { font: 400 .75rem/1.5 var(--game); text-align: center; padding: 0 2px; border: 1px solid currentColor; }
.k.order { color: var(--accent); } .k.start { color: var(--live); } .k.done { color: var(--done); } .k.fail { color: var(--fix); } .k.note { color: var(--wait); }
.feed time { color: var(--muted); font-size: .72rem; display: block; }
.note { color: var(--muted); font-size: .8rem; }
.staffrow { display: flex; flex-direction: column; gap: 2px; padding: 6px 9px; border: 1px solid var(--line); background: var(--surface-2); font-size: .85rem; }
.staffrow b { font: 400 .95rem/1.2 var(--game); }
.staffrow span { color: var(--muted); font-size: .78rem; }
.srOnly { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (prefers-reduced-motion: reduce) { .stage.shake { animation: none; } .live.on i { animation: none; } }
</style>

<main>
  <header>
    <div>
      <h1>에이전트 오피스</h1>
      <div class="sub"><span class="live" id="live"><i></i><span id="live-text">연결 중…</span></span><span id="stamp"></span></div>
    </div>
  </header>
  <section class="status" aria-label="오늘의 현황">
    <div class="head"><span id="headline">사장님 대기 중</span><small id="detail"></small></div>
    <div class="counts" id="counts"></div>
    <div class="btns"><button id="b-night" type="button" aria-pressed="false">야간 모드 보기</button><button id="b-replay" type="button">최근 활동 다시 보기</button><button id="b-demo" class="primary" type="button">데모 재생</button></div>
  </section>
  <div class="layout">
    <div>
      <div class="stage" id="stage">
        <canvas id="cv" tabindex="0" aria-label="6층 건물 단면. 맨 위 사장실, 아래로 기획실, 개발실, 3층 휴게·회의실(복층), 화면실, 1층 데이터와 배포. 오른쪽에 엘리베이터. 에이전트는 포켓몬풍 캐릭터로 표시됩니다. 같은 정보가 오른쪽 목록에도 있습니다."></canvas>
        <div class="ov" id="ov"></div>
      </div>
      <p class="srOnly" id="live-msg" role="status" aria-live="polite"></p>
      <p class="note" style="margin:8px 0 0">사장님이 메일로 업무를 내리면 캐릭터가 엘리베이터로 오가며 일하고 보고합니다. 캐릭터를 누르면 이름과 상태가 보입니다.</p>
    </div>
    <div class="side">
      <section class="panel" aria-label="에이전트 목록"><h2>에이전트</h2><div id="agents"></div></section>
      <section class="panel" aria-label="건물 직원"><h2>건물 직원</h2><div id="staff"></div></section>
      <section class="panel" aria-label="최근 소식"><h2>최근 소식</h2><ul class="feed" id="feed"></ul></section>
    </div>
  </div>
</main>

<script>
'use strict';
/* =====================================================================
   고정 상수·팔레트 (건물 그림은 테마와 무관한 고정 색)
   ===================================================================== */
const W = 400, TOP = 24;
const FL = ['ceo', 'plan', 'dev', 'lounge', 'ui', 'ops'];
const NF = FL.length;
const FHS = [80, 80, 80, 112, 80, 80];                 // 층 높이(논리 px). 휴게·회의실은 로프트(복층)라 더 높다
const FOFF = FHS.map((_, i) => FHS.slice(0, i).reduce((q, v) => q + v, 0));
const BH = FOFF[NF - 1] + FHS[NF - 1];                  // 건물 전체 높이
const H = TOP + BH + 18;                                // 논리 해상도
const OPS = FL.indexOf('ops'), LNG = FL.indexOf('lounge');
const FLOOR_NAME = { ceo: '6F 사장실', plan: '5F 기획·규칙실', dev: '4F 개발실', lounge: '3F 휴게·회의실', ui: '2F 화면·디자인실', ops: '1F 데이터·검수·배포' };
const FLOOR_SHORT = { ceo: '사장실', plan: '기획실', dev: '개발실', lounge: '휴게실', ui: '화면실', ops: '1층' };
const fTop = (i) => TOP + FOFF[i], fFeet = (i) => TOP + FOFF[i] + FHS[i] - 10;
const DOOR_X = 364, QUEUE_X = 330, SHAFT_L = 345, SHAFT_R = 383;
const DESK_X = [168, 198, 228, 258, 288, 318];
// 휴게·회의실(3F, 복층): 앞줄(바닥)과 위줄(로프트)에 자리를 놓는다. 캐릭터 폭(≤30px) 이상 간격이라 겹치지 않고, 두 줄은 세로로 떨어져 있다.
// pose: sofa(소파에 앉기) · stand(서 있기) · snack(간식 먹기) · meet(회의 테이블에 앉기)
const LOFT_H = 50, STAIR_TOP = 296, STAIR_BOT = 326;   // 로프트 높이와 계단 구간(x). 계단 아래 끝 바로 옆(STAIR_BOT+2)이 위·아래 갈림길
const stairY = (x) => LOFT_H * Math.max(0, Math.min(1, (STAIR_BOT - x) / (STAIR_BOT - STAIR_TOP)));
const LOUNGE = [
  { id: 'S0', x: 24, pose: 'sofa', face: 1 }, { id: 'S1', x: 54, pose: 'sofa', face: 1, doze: true },
  { id: 'C0', x: 92, pose: 'snack', face: 1 }, { id: 'V0', x: 122, pose: 'stand', face: -1 }, { id: 'W0', x: 152, pose: 'stand', face: 1 },
  { id: 'M0', x: 190, pose: 'meet', face: 1 }, { id: 'M1', x: 220, pose: 'meet', face: -1 }, { id: 'M2', x: 250, pose: 'meet', face: -1 },
  ...[24, 53, 82, 111, 140, 169, 198, 227, 256, 285].map((x, i) => ({ id: 'U' + i, x, pose: 'stand', face: i % 3 === 2 ? -1 : 1, loft: true }))
];
const BOSS_X = 270, VISIT_X = 112;
const K = '#2a2035';
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
let SPEED = reduce ? 3 : 1;

/* =====================================================================
   스프라이트(32×32 손그림 + 자동 음영)
   ===================================================================== */
const WHITE = '#fffdf2';
/* =====================================================================
   스프라이트 엔진: 32×32 해상도, 도형 명령으로 손그림. 명령은 모두 오리지널 해석이다.
   - 색이 배열 [밝은색, 기본, 그늘, (진한 그늘)]이면 "음영 면"(덩어리): 윗·왼쪽 가장자리 1px는 밝게, 아래·오른쪽 가장자리는 어둡게 자동 칠한다.
   - 색이 문자열이면 "디테일"(눈·볼·무늬): 아래 덩어리의 면을 그대로 두고 색만 덮는다.
   - 마지막에 바깥 윤곽선(1px)을 자동으로 두른다.
   ===================================================================== */
function mkSprite(w, h, build, ol = K) {
  const N = w * h, col = new Array(N).fill(null), lay = new Int16Array(N), pal = new Array(N).fill(null);
  let LID = 0;
  const inb = (x, y) => x >= 0 && y >= 0 && x < w && y < h;
  const flat = (x, y, c) => { x = Math.round(x); y = Math.round(y); if (!inb(x, y)) return; const i = y * w + x; col[i] = c; pal[i] = null; if (!lay[i]) lay[i] = ++LID; };
  const fillPx = (x, y, c, id) => { if (!inb(x, y)) return; const i = y * w + x; lay[i] = id; col[i] = Array.isArray(c) ? c[1] : c; pal[i] = Array.isArray(c) ? c : null; };
  const paint = (x, y, c, id) => { if (Array.isArray(c)) fillPx(x, y, c, id); else flat(x, y, c); };
  const s = {
    P(x, y, c, m) { flat(x, y, c); if (m) flat(w - 1 - x, y, c); },
    R(x, y, ww, hh, c, m) {
      const id = ++LID;
      for (let j = 0; j < hh; j++) for (let i = 0; i < ww; i++) paint(x + i, y + j, c, id);
      if (m) s.R(w - x - ww, y, ww, hh, c);
    },
    E(cx, cy, rx, ry, c, m, id) {
      id = id ?? ++LID;
      for (let y = Math.floor(cy - ry); y <= Math.ceil(cy + ry); y++) for (let x = Math.floor(cx - rx); x <= Math.ceil(cx + rx); x++) {
        const nx = (x + 0.5 - cx) / rx, ny = (y + 0.5 - cy) / ry;
        if (nx * nx + ny * ny <= 1) paint(x, y, c, id);
      }
      if (m) s.E(w - cx, cy, rx, ry, c, false);
    },
    T(pts, c, m) {
      const id = ++LID, xs = pts.map((p) => p[0]), ys = pts.map((p) => p[1]);
      for (let y = Math.floor(Math.min(...ys)); y <= Math.ceil(Math.max(...ys)); y++) for (let x = Math.floor(Math.min(...xs)); x <= Math.ceil(Math.max(...xs)); x++) {
        const px = x + 0.5, py = y + 0.5; let ins = false;
        for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
          const [xi, yi] = pts[i], [xj, yj] = pts[j];
          if ((yi > py) !== (yj > py) && px < (xj - xi) * (py - yi) / (yj - yi) + xi) ins = !ins;
        }
        if (ins) paint(x, y, c, id);
      }
      if (m) s.T(pts.map(([x, y]) => [w - x, y]), c);
    },
    L(x0, y0, x1, y1, c, m) {
      x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);
      const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1; let err = dx + dy;
      for (;;) { flat(x0, y0, c); if (m) flat(w - 1 - x0, y0, c); if (x0 === x1 && y0 === y1) break; const e2 = 2 * err; if (e2 >= dy) { err += dy; x0 += sx; } if (e2 <= dx) { err += dx; y0 += sy; } }
    },
    // 굵기가 변하는 곡선 관: 점 4개면 3차 베지어, 그 외는 꺾은선
    path(pts, r0, r1, c, m) {
      const id = ++LID, n = 40, at = (u) => {
        if (pts.length === 4) { const v = 1 - u; return [0, 1].map((k) => v * v * v * pts[0][k] + 3 * v * v * u * pts[1][k] + 3 * v * u * u * pts[2][k] + u * u * u * pts[3][k]); }
        const f = u * (pts.length - 1), i = Math.min(pts.length - 2, Math.floor(f)), q = f - i; return [0, 1].map((k) => pts[i][k] * (1 - q) + pts[i + 1][k] * q);
      };
      for (let i = 0; i <= n; i++) { const u = i / n, [x, y] = at(u), r = r0 + (r1 - r0) * u; s.E(x, y, r, r, c, false, id); }
      if (m) s.path(pts.map(([x, y]) => [w - x, y]), r0, r1, c);
    },
    eye(x, y, ww = 3, hh = 4, m, c = K) {
      const one = (ex) => { s.R(ex, y, ww, hh, c); s.P(ex, y, WHITE); if (hh >= 4 && ww >= 3) s.P(ex + 1, y + hh - 1, '#8a7a9a'); };
      one(x); if (m) one(w - x - ww);
    },
    FF(x, y, ww, hh, c) { s.R(x, y - (s.fr === 1 ? 2 : 0), ww, hh, c); s.R(w - x - ww, y - (s.fr === 2 ? 2 : 0), ww, hh, c); },
    fr: 0, t: 0, w, h
  };
  return { s, build, finish() {
    build(s);
    const idAt = (x, y) => (x < 0 || y < 0 || x >= w || y >= h ? 0 : lay[y * w + x]);
    const out = new Array(N).fill(null);
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const i = y * w + x; if (!col[i]) continue;
      let c = col[i]; const p = pal[i];
      if (p) {
        const id = lay[i];
        const ul = idAt(x - 1, y) !== id || idAt(x, y - 1) !== id;
        const lr1 = idAt(x + 1, y) !== id || idAt(x, y + 1) !== id;
        const lr2 = idAt(x + 2, y) !== id || idAt(x, y + 2) !== id || idAt(x + 1, y + 1) !== id;
        if (ul && !lr1) c = p[0];
        else if (lr1 && !ul) c = (p[3] && idAt(x, y + 1) !== id && idAt(x + 1, y) !== id) ? p[3] : p[2];
        else if (lr2 && !ul) c = p[2];
      }
