<!doctype html><html lang="ko"><meta charset="utf-8"><title>전체 페이스팩 연동 예제</title><style>body{background:#14241b;color:white;font:16px system-ui;padding:30px}.row{display:flex;gap:20px;flex-wrap:wrap}canvas{background:#334b3b;border-radius:12px;width:200px}p{line-height:1.7}</style><h1>실제 선수 · 사진 없음 · 생성선수</h1><div class="row"><div><canvas id="real" width="235" height="305"></canvas><p>허재 / DB</p></div><div><canvas id="missing" width="235" height="305"></canvas><p>사진 없음 / SK</p></div><div><canvas id="newgen" width="235" height="305"></canvas><p>고정 ID 신인 / LG</p></div></div><p id="status">로딩 중…</p><script src="data.js"></script><script src="facepack.js"></script><script>(async()=>{try{const fp=await KBLFacePack.create();const r=await Promise.all([fp.render(document.getElementById('real'),{id:'245065',teamId:'db'}),fp.render(document.getElementById('missing'),{id:'291677',teamId:'sk'}),fp.render(document.getElementById('newgen'),{id:'rookie-2028-0001',isGenerated:true,teamId:'lg'})]);document.getElementById('status').textContent=r.map(x=>x.kind+' / '+(x.faceKey||'실제 사진')).join(' · ');}catch(e){document.getElementById('status').textContent=e.message;}})();</script></html>
