<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pixel Office</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><span class="logo" aria-hidden="true"></span><h1>PIXEL OFFICE</h1></div>
    <div class="sum" id="sum" aria-live="polite"></div>
    <div class="ctl">
      <div class="seg" id="tod" role="group" aria-label="시간대">
        <button data-v="auto" class="on">자동</button><button data-v="day">낮</button><button data-v="night">밤</button>
      </div>
      <button class="tgl on" id="demo" aria-pressed="true" title="샘플 에이전트 표시/숨김">SAMPLE</button>
      <span class="clock" id="clock">--:--</span>
    </div>
  </header>

  <main class="stage">
    <section class="view" id="view">
      <div class="vp" id="vp">
        <canvas id="c" width="384" height="216" aria-label="사무실 화면"></canvas>
        <div id="tags"></div>
        <div id="tip" class="tip" hidden></div>
        <nav class="elev" id="elev" aria-label="층 선택"></nav>
      </div>
      <p class="hint">캐릭터를 클릭하면 상세 정보 · 숫자키 1–9 또는 ↑↓ 로 층 이동 · Esc 선택 해제</p>
    </section>

    <aside class="side">
      <section class="panel">
        <h2>BUILDING</h2>
        <ul id="bld" class="floors"></ul>
      </section>
      <section class="panel">
        <h2 id="agT">AGENTS</h2>
        <ul id="agents" class="cards"></ul>
      </section>
      <section class="panel" id="detail" hidden></section>
    </aside>
  </main>
  <footer class="foot" id="foot"></footer>
</div>

<script src="data.js"></script>
<script src="js/sprites.js"></script>
<script src="js/scene.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
